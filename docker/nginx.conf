# Sert la bêta : fichiers statiques produits par `vite build`.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Fichiers à nom haché par Vite (index-C3eES0aw.js…) : leur contenu ne change jamais.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|png|jpg|svg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Licences et autres textes : lisibles directement dans le navigateur.
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
        add_header X-Content-Type-Options nosniff;
    }

    # La page elle-même n'est jamais mise en cache : une nouvelle bêta est prise tout de suite.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
